<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc"><title id="title">AgentGuard Team — From risks to adaptive defenses</title><desc id="desc">AgentHazard measures risk, VERA verifies execution, and BraveGuard, HazardAuditor and AdaGuard explore complementary guard capabilities.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112b40"/><stop offset="1" stop-color="#10212e"/></linearGradient></defs><rect width="1280" height="540" rx="24" fill="url(#bg)"/><g fill="none" stroke="#26465c"><circle cx="1110" cy="225" r="140"/><circle cx="1110" cy="225" r="210"/><circle cx="1110" cy="225" r="280"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="62" font-size="17" font-weight="700" fill="#b6d1e4" letter-spacing="2">AGENTGUARD TEAM</text><text x="62" y="161" font-size="62" font-weight="700" fill="#f8f8f8" letter-spacing="-2">From risks to</text><text x="62" y="231" font-size="62" font-weight="700" fill="#fddeb1" letter-spacing="-2">adaptive defenses.</text><text x="65" y="283" font-size="21" fill="#c2d3df">Open research for agents that act safely in the real world.</text><rect x="62" y="340" width="214" height="120" rx="12" fill="#eaf4fd"/><rect x="296" y="340" width="184" height="120" rx="12" fill="#eaf4fd"/><rect x="500" y="340" width="218" height="120" rx="12" fill="#1697e2"/><rect x="738" y="340" width="235" height="120" rx="12" fill="#1697e2"/><rect x="993" y="340" width="225" height="120" rx="12" fill="#fddeb1"/><g font-size="12" font-weight="700" letter-spacing="1"><text x="83" y="370" fill="#496275">01 / MEASURE</text><text x="317" y="370" fill="#496275">02 / VERIFY</text><text x="521" y="370" fill="#fff">03 / LEARN</text><text x="759" y="370" fill="#fff">04 / AUDIT</text><text x="1014" y="370" fill="#496275">05 / ADAPT</text></g><g font-size="23" font-weight="700"><text x="83" y="415" fill="#112333">AgentHazard</text><text x="317" y="415" fill="#112333">VERA</text><text x="521" y="415" fill="#fff">BraveGuard</text><text x="759" y="415" fill="#fff">HazardAuditor</text><text x="1014" y="415" fill="#112333">AdaGuard</text></g><text x="62" y="502" font-size="13" fill="#9ab8ce" letter-spacing="1">BENCHMARKS · EXECUTABLE VERIFICATION · ADAPTIVE GUARDS</text></g><path d="M1110 122l60 25-8 80-52 45-52-45-8-80z" fill="none" stroke="#1697e2" stroke-width="5"/><path d="M1084 190l19 20 35-41" fill="none" stroke="#fddeb1" stroke-width="5"/></svg>
